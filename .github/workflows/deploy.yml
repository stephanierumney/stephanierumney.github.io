name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site from CMS data
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          rsync -av --exclude 'deploy' --exclude '.git' --exclude '.github' \
            --exclude 'node_modules' --exclude 'scripts' --exclude 'scss' ./ deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
